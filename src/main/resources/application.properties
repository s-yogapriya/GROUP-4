spring.application.name=carbonfootprint

spring.datasource.url=jdbc:postgresql://localhost:5432/carbon_footprint
spring.datasource.username=postgres
spring.datasource.password=post@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# -----------------------------------------------------------
#  Email / SMTP Configuration
# -----------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender address (used in From header)
app.email.from-address=noreply@carbonfootprint.com
app.email.support-address=support@carbonfootprint.com
app.email.login-url=http://localhost:8080/login

# -----------------------------------------------------------
#  JWT Configuration
# -----------------------------------------------------------
app.jwt.secret=3cfa76ef14937c1c0ea190fabb3d5097b42f1f84b745c1c0ea190fabb3d5097b42f1f84b745
app.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload (if government ID documents will be uploaded)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false